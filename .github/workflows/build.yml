---

name: build

on:
  push:
    branches: ['**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}--${{ github.ref }}
  cancel-in-progress: true

jobs:

  posix-test-minimum:
    runs-on: ${{ matrix.os }}

    timeout-minutes: 30

    needs: [posix-prepare]

    strategy:
      fail-fast: false
      matrix:
        os:  [ubuntu-26.04, macos-26]
        python-version: ['3.15']
        tests: [functional]

    env:
      MATRIX_TESTS: ${{ matrix.tests }}

    steps:

    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up pip cache
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ matrix.os }}--pip-py${{ matrix.python-version }}--${{ hashFiles('.github/requirements-minimum.txt') }}

    - name: Run tests
      run: . .github/posix-test-minimum.sh

    - name: Upload log files
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: log-${{ matrix.os }}--py${{ matrix.python-version }}-minimum-${{ job.status }}
        path: |
          testenv/*.log
          testenv/trac/log
          geckodriver.log
        if-no-files-found: ignore


  posix-test:
    runs-on: ${{ matrix.os }}

    timeout-minutes: 50

    needs: [posix-prepare]

    strategy:
      fail-fast: false
      matrix:
        include:
        - {os: ubuntu-26.04, python-version: '3.15', tracdb: sqlite,     tests: functional}
        - {os: ubuntu-26.04, python-version: '3.15', tracdb: postgresql, tests: functional}
        - {os: ubuntu-26.04, python-version: '3.15', tracdb: mysql,      tests: functional}
        - {os: ubuntu-26.04, python-version: '3.15', tracdb: ''}
        - {os: ubuntu-26.04, python-version: '3.14', tracdb: ''}
        - {os: ubuntu-26.04, python-version: '3.13', tracdb: ''}
        - {os: ubuntu-26.04, python-version: '3.12', tracdb: ''}
        - {os: ubuntu-26.04, python-version: '3.11', tracdb: ''}
        - {os: ubuntu-26.04, python-version: '3.10', tracdb: ''}
        - {os: ubuntu-24.04, python-version: '3.9',  tracdb: ''}
        - {os: ubuntu-24.04, python-version: '3.8',  tracdb: ''}
        - {os: ubuntu-22.04, python-version: '3.7',  tracdb: ''}
        - {os: macos-26,     python-version: '3.15', tracdb: sqlite,     tests: functional}
        - {os: macos-26,     python-version: '3.15', tracdb: postgresql}
        - {os: macos-26,     python-version: '3.15', tracdb: mysql}
        - {os: macos-26,     python-version: '3.15', tracdb: ''}
        - {os: macos-26,     python-version: '3.14', tracdb: ''}
        - {os: macos-26,     python-version: '3.13', tracdb: ''}

    env:
      MATRIX_OS: ${{ matrix.os }}
      MATRIX_TRACDB: ${{ matrix.tracdb }}
      MATRIX_TESTS: ${{ matrix.tests }}
      PIP_NO_PYTHON_VERSION_WARNING: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'

    steps:

    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up pip cache
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ matrix.os }}--pip-py${{ matrix.python-version }}--${{ hashFiles('.github/requirements.txt') }}

    - name: Set up svn python cache
      uses: actions/cache@v5
      with:
        path: |
          ~/venv/lib/libsvn_*
          ~/venv/lib/python*.*/site-packages/svn
          ~/venv/lib/python*.*/site-packages/libsvn
        key: ${{ matrix.os }}--svn-py${{ matrix.python-version }}

    - name: Run tests
      run: . .github/posix-test.sh

    - name: Upload log files
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: log-${{ matrix.os }}--py${{ matrix.python-version }}-${{ matrix.tracdb }}-${{ job.status }}
        path: |
          testenv/*.log
          testenv/trac/log
          geckodriver.log
        if-no-files-found: ignore


  posix-prepare:
    runs-on: ${{ matrix.os }}

    timeout-minutes: 50

    strategy:
      fail-fast: false
      matrix:
        include:
        - {os: ubuntu-26.04, python-version: '3.15'}
        - {os: ubuntu-26.04, python-version: '3.14'}
        - {os: ubuntu-26.04, python-version: '3.13'}
        - {os: ubuntu-26.04, python-version: '3.12'}
        - {os: ubuntu-26.04, python-version: '3.11'}
        - {os: ubuntu-26.04, python-version: '3.10'}
        - {os: ubuntu-24.04, python-version: '3.9'}
        - {os: ubuntu-24.04, python-version: '3.8'}
        - {os: ubuntu-22.04, python-version: '3.7'}
        - {os: macos-26,     python-version: '3.15'}
        - {os: macos-26,     python-version: '3.14'}
        - {os: macos-26,     python-version: '3.13'}

    env:
      MATRIX_OS: ${{ matrix.os }}
      PIP_NO_PYTHON_VERSION_WARNING: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'

    steps:

    - name: Checkout
      uses: actions/checkout@v6

    - name: Checkout py3c
      uses: actions/checkout@v6
      with:
        repository: encukou/py3c
        ref: v1.4
        path: py3c

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up pip cache
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ matrix.os }}--pip-py${{ matrix.python-version }}--${{ hashFiles('.github/requirements.txt') }}

    - name: Set up svn python cache
      uses: actions/cache@v5
      with:
        path: |
          ~/venv/lib/libsvn_*
          ~/venv/lib/python*.*/site-packages/svn
          ~/venv/lib/python*.*/site-packages/libsvn
        key: ${{ matrix.os }}--svn-py${{ matrix.python-version }}

    - name: Prepare dependencies
      run: . .github/posix-prepare.sh


  windows-test-minimum:
    runs-on: ${{ matrix.os }}

    timeout-minutes: 30

    needs: [windows-prepare]

    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
        architecture: [x64]
        python-version: ['3.15']
        tests: [functional]

    env:
      MATRIX_TESTS: ${{ matrix.tests }}

    defaults:
      run:
        shell: pwsh

    steps:

    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up pip cache
      uses: actions/cache@v5
      with:
        path: ~\AppData\Local\pip\Cache
        key: ${{ matrix.os }}--pip-py${{ matrix.python-version }}--${{ hashFiles('.github/requirements-minimum.txt') }}

    - name: Run tests
      run: . .github\windows-test-minimum.ps1

    - name: Upload log files
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: log-${{ matrix.os }}--py${{ matrix.python-version }}-minimum-${{ job.status }}
        path: |
          testenv/*.log
          testenv/trac/log
          geckodriver.log
        if-no-files-found: ignore


  windows-test:
    runs-on: ${{ matrix.os }}

    timeout-minutes: 80

    needs: [windows-prepare]

    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
        architecture: [x64]
        python-version: ['3.15']
        subversion-version: ['1.15.0']
        tracdb: ['', sqlite, postgresql, mysql]
        include:
        - {tracdb: '', tests: functional}

    env:
      MATRIX_TRACDB: ${{ matrix.tracdb }}
      MATRIX_TESTS: ${{ matrix.tests }}
      MATRIX_ARCH: ${{ matrix.architecture }}
      MATRIX_PYVER: ${{ matrix.python-version }}
      MATRIX_SVNVER: ${{ matrix.subversion-version }}
      PIP_NO_PYTHON_VERSION_WARNING: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'

    defaults:
      run:
        shell: pwsh

    steps:

    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up pip cache
      uses: actions/cache@v5
      with:
        path: ~\AppData\Local\pip\Cache
        key: ${{ matrix.os }}--pip-py${{ matrix.python-version }}--${{ hashFiles('.github/requirements.txt') }}

    - name: Set up svn cache
      uses: actions/cache@v5
      with:
        path: ~\AppData\Local\subversion-${{ matrix.subversion-version }}\${{ matrix.architecture }}
        key: ${{ matrix.os }}--${{ matrix.architecture }}-svn${{ matrix.subversion-version }}-py${{ matrix.python-version }}

    - name: Run tests
      run: . .github\windows-test.ps1

    - name: Upload log files
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: log-${{ matrix.os }}--py${{ matrix.python-version }}-${{ matrix.tracdb }}-${{ job.status }}
        path: |
          testenv/*.log
          testenv/trac/log
          geckodriver.log
        if-no-files-found: ignore


  windows-prepare:
    runs-on: ${{ matrix.os }}

    timeout-minutes: 50

    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
        architecture: [x64]
        python-version: ['3.15']
        subversion-version: ['1.15.0']

    env:
      MATRIX_ARCH: ${{ matrix.architecture }}
      MATRIX_PYVER: ${{ matrix.python-version }}
      MATRIX_SVNVER: ${{ matrix.subversion-version }}
      PIP_NO_PYTHON_VERSION_WARNING: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'

    defaults:
      run:
        shell: pwsh

    steps:

    - name: Checkout
      uses: actions/checkout@v6

    - name: Checkout py3c
      uses: actions/checkout@v6
      with:
        repository: encukou/py3c
        ref: v1.4
        path: py3c

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up pip cache
      uses: actions/cache@v5
      with:
        path: ~\AppData\Local\pip\Cache
        key: ${{ matrix.os }}--pip-py${{ matrix.python-version }}--${{ hashFiles('.github/requirements.txt') }}

    - name: Set up svn cache
      uses: actions/cache@v5
      with:
        path: ~\AppData\Local\subversion-${{ matrix.subversion-version }}\${{ matrix.architecture }}
        key: ${{ matrix.os }}--${{ matrix.architecture }}-svn${{ matrix.subversion-version }}-py${{ matrix.python-version }}

    - name: Set up vcpkg cache
      uses: actions/cache@v5
      with:
        path: |
          ~\AppData\Local\vcpkg\archives
          ~\AppData\Local\vcpkg\downloads\7z*
        key: ${{ matrix.os }}--${{ matrix.architecture }}-vcpkg--${{ hashFiles('.github/vcpkg.txt') }}

    - name: Set up cache of subversion archive
      uses: actions/cache@v5
      with:
        path: subversion-${{ matrix.subversion-version }}.zip
        key: subversion-${{ matrix.subversion-version }}.zip

    - name: Set up cache of sqlite archive
      uses: actions/cache@v5
      with:
        path: sqlite-amalgamation-3081101.zip
        key: sqlite-amalgamation-3081101.zip

    - name: Set up cache of swigwin binary
      uses: actions/cache@v5
      with:
        path: swigwin-3.0.12.zip
        key: swigwin-3.0.12.zip

    - name: Set up msbuild
      uses: microsoft/setup-msbuild@v3

    - name: Prepare dependencies
      run: . .github\windows-prepare.ps1

    - name: Upload log files
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: svnlog-${{ matrix.os }}-${{ matrix.architecture }}--${{ matrix.subversion-version }}-py${{ matrix.python-version }}
        path: subversion-*\*.log
        if-no-files-found: ignore

    - name: Upload Subversion binaries
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: svnbin-${{ matrix.os }}-${{ matrix.architecture }}--${{ matrix.subversion-version }}-py${{ matrix.python-version }}
        path: ~\AppData\Local\subversion-${{ matrix.subversion-version }}
        if-no-files-found: ignore


  release:
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted && github.repository == 'updateit-co-jp/udi-custom-trac' }}
    runs-on: ubuntu-24.04

    timeout-minutes: 10

    needs: [posix-test-minimum, posix-test, windows-test-minimum, windows-test]

    permissions:
      contents: write

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'

    steps:

    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements-build.txt

    - name: Build and check the release wheel
      shell: bash
      run: |
        if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          echo "::error::Expected a release tag in vX.Y.Z format"
          exit 1
        fi

        version=${GITHUB_REF_NAME#v}
        python - "$version" <<'PY'
        from configparser import ConfigParser
        from pathlib import Path
        import sys

        path = Path("setup.cfg")
        setup = ConfigParser(interpolation=None)
        setup.read(path, encoding="utf-8")
        setup["metadata"]["version"] = sys.argv[1]
        setup.remove_option("egg_info", "tag_build")
        with path.open("w", encoding="utf-8") as f:
            setup.write(f)
        PY
        python -m pip install -r requirements-build.txt
        make wheel
        wheel="$PWD/dist/trac-$version-py3-none-any.whl"
        python -m venv "$RUNNER_TEMP/trac-wheel-check"
        bin="$RUNNER_TEMP/trac-wheel-check/bin"
        cd "$RUNNER_TEMP"
        "$bin/python" -m pip install "$wheel"
        "$bin/python" - "$version" <<'PY'
        from importlib.metadata import distribution
        import sys

        trac = distribution("Trac")
        if trac.version != sys.argv[1]:
            raise SystemExit("Wheel metadata version does not match the release tag")
        expected = (
            "trac/locale/ja/LC_MESSAGES/messages.mo",
            "trac/locale/ja/LC_MESSAGES/tracini.mo",
            "trac/htdocs/js/messages/ja.js",
        )
        for path in expected:
            if not trac.locate_file(path).is_file():
                raise SystemExit("Wheel is missing " + path)
        PY
        "$bin/trac-admin" "$RUNNER_TEMP/trac-smoke-env" initenv "Wheel smoke test" sqlite:db/trac.db
        "$bin/tracd" --version

    - name: Attach the wheel to a draft GitHub release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        tag="$GITHUB_REF_NAME"
        version=${tag#v}
        wheel="dist/trac-$version-py3-none-any.whl"
        release=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
          jq -c --arg tag "$tag" '.[] | select(.tag_name == $tag)')
        if [[ -n "$release" && $(jq -r '.draft' <<< "$release") == false ]]; then
          echo "Release $tag is already published"
          exit 0
        fi

        refs=$(git ls-remote origin refs/heads/main "$GITHUB_REF" "$GITHUB_REF^{}")
        main=$(awk '$2 == "refs/heads/main" {print $1}' <<< "$refs")
        tagged=$(awk -v ref="$GITHUB_REF" '
          $2 == ref {tag = $1}
          $2 == ref "^{}" {commit = $1}
          END {print (commit ? commit : tag)}
        ' <<< "$refs")
        built=$(git rev-parse HEAD)
        if [[ "$built" != "$main" || "$built" != "$tagged" ]]; then
          echo "::error::The release tag must still point to the current main commit"
          exit 1
        fi

        if [[ -z "$release" ]]; then
          gh release create "$tag" "$wheel" --draft --verify-tag --title "$tag" --generate-notes
        else
          state=$(jq -r --arg asset "${wheel##*/}" '
            .assets[] | select(.name == $asset) | .state
          ' <<< "$release")
          case "$state" in
            uploaded) echo "Draft $tag already contains ${wheel##*/}" ;;
            "") gh release upload "$tag" "$wheel" ;;
            *) gh release upload "$tag" "$wheel" --clobber ;;
          esac
        fi

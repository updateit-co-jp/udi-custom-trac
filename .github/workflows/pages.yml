name: GitHub Pages

# Builds ghpages_frontend/ with uv and deploys dist/ with the GitHub Pages
# Actions deployment (no gh-pages branch push, so GITHUB_TOKEN is not involved).
# Pages の配信元は「GitHub Actions」に設定しておく必要があります。
on:
  push:
    branches: [main]
    paths:
      - 'ghpages_frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          prune-cache: true

      - name: Prepare Python 3.14 and docutils
        working-directory: ghpages_frontend
        run: |
          uv python install 3.14
          uv venv --python 3.14 --managed-python .venv
          uv pip install --python .venv/bin/python -r requirements.txt

      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ghpages_frontend/pnpm-lock.yaml

      - name: Install Node dependencies
        working-directory: ghpages_frontend
        run: pnpm install --frozen-lockfile

      - name: Build site
        working-directory: ghpages_frontend
        env:
          PYTHON: .venv/bin/python
        run: pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ghpages_frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
